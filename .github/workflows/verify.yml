name: verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Rebuild native modules for this Node ABI
        run: npm rebuild better-sqlite3

      - name: Publishable-data guard (working tree)
        run: npm run guard

      # A file deleted from the working tree is still in history, and a public
      # push publishes every commit. The working-tree scan cannot see that.
      # Runs generic rules only: the private denylist is never available to CI.
      - name: Publishable-data guard (full history)
        run: npm run guard:history

      - run: npm run typecheck

      # Build BEFORE test, and keep it that way. The migration parity check is
      # gated on dist/, which is not committed, so testing first skipped it on
      # every clean checkout — that is, on every run this workflow has ever
      # done — while the job still went green.
      - run: npm run build
      - run: npm test

  # Separate job, and deliberately not on windows-latest. Scanning reads git
  # history, so the platform it runs on is arbitrary — and gitleaks ships
  # .tar.gz for Linux but .zip for Windows, which is precisely what broke this
  # job while it ran there: the download 404'd before the scan started. A secret
  # scan that fails red for a reason that has nothing to do with secrets is one
  # that eventually gets ignored.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The binary, not gitleaks-action. The action is a Node 20 action that the
      # runner now forces onto Node 24, and all it wraps is the download below.
      # Pinning it here means the version that scanned a commit is the version
      # written in this file, and a bump is a reviewable diff rather than the
      # scanner changing underneath an unchanged green badge.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      # `git` scans the history through `git log -p`, which is why the checkout
      # above is unshallow — a shallow one would scan a single commit and pass.
      # `detect` did the same job but has been deprecated since 8.19. --redact
      # keeps any finding out of a public log, and the exit code is 1 on a
      # finding, which is what fails the job.
      - name: Secret scan (full history)
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner .
